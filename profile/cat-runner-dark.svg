<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Hi, I'm Arvemy - a pixel cat running and jumping over cacti">
<style>
  .fg { fill: #9198a1; }
  .muted { fill: #3d444d; }
  .title { font: 700 20px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; letter-spacing: 2px; }
  .jump { animation: jump 2s infinite; }
  .legs-a { animation: step 0.3s steps(1) infinite; }
  .legs-b { animation: step 0.3s steps(1) infinite -0.15s; }
  .cactus { animation: scroll 4s linear infinite; }
  .cactus.b { animation-delay: -2s; }
  .ground { animation: dash 0.1818s linear infinite; }
  .cloud { animation: drift 18s linear infinite -4s; }
  .cloud.b { animation-delay: -13s; }
  @keyframes jump {
    0%, 50% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    67.9% { transform: translateY(-68px); animation-timing-function: cubic-bezier(.6,0,.8,.3); }
    85.4%, 100% { transform: translateY(0); }
  }
  @keyframes step { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-880px); } }
  @keyframes dash { from { transform: translateX(0); } to { transform: translateX(-40px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="820" y="34" text-anchor="end" class="title fg">HI, I'M ARVEMY</text>
