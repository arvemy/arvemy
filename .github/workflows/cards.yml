name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate summary cards (light)
        uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: arvemy
          THEME: github
          ANIMATION: load
          DURATION: "3"
          UTC_OFFSET: 3
          AUTO_PUSH: false

      # Each run clears the output folder, so set the light cards aside.
      - name: Stash light cards
        run: mv profile-summary-card-output/github "$RUNNER_TEMP/github"

      - name: Generate summary cards (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: arvemy
          THEME: github_dark
          ANIMATION: load
          DURATION: "3"
          UTC_OFFSET: 3
          AUTO_PUSH: false

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=arvemy&show_icons=true&include_all_commits=true&count_private=true&rank_icon=default&custom_title=GitHub Stats&show=prs_merged,prs_merged_percentage&hide=issues,contribs&hide_border=true&bg_color=00000000&title_color=1f2328&text_color=59636e&icon_color=0969da&ring_color=0969da
          path: profile/stats-light.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=arvemy&show_icons=true&include_all_commits=true&count_private=true&rank_icon=default&custom_title=GitHub Stats&show=prs_merged,prs_merged_percentage&hide=issues,contribs&hide_border=true&bg_color=00000000&title_color=e6edf3&text_color=9198a1&icon_color=4493f8&ring_color=4493f8
          path: profile/stats-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          mv "$RUNNER_TEMP/github" profile-summary-card-output/github
          # Drop the card frame so it blends in like the other widgets.
          sed -i -E '/<rect x="1" y="1" rx="5"/{s/stroke-opacity="1"/stroke-opacity="0"/;s/fill="#[0-9a-fA-F]+"/fill="none"/}' profile-summary-card-output/*/*.svg
          mkdir -p profile
          cp profile-summary-card-output/github/2-most-commit-language.svg profile/commit-langs-light.svg
          cp profile-summary-card-output/github_dark/2-most-commit-language.svg profile/commit-langs-dark.svg
          rm -rf profile-summary-card-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile
          git commit -m "Update README cards" || true
          git push
