name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate summary cards (light)
        uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: arvemy
          THEME: github
          ANIMATION: load
          DURATION: "3"
          UTC_OFFSET: 3
          AUTO_PUSH: false

      # Each run clears the output folder, so set the light cards aside.
      - name: Stash light cards
        run: mv profile-summary-card-output/github "$RUNNER_TEMP/github"

      - name: Generate summary cards (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: arvemy
          THEME: github_dark
          ANIMATION: load
          DURATION: "3"
          UTC_OFFSET: 3
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          mv "$RUNNER_TEMP/github" profile-summary-card-output/github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git commit -m "Update README cards" || true
          git push
